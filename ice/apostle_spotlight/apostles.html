<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            background: #e8eced;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            font-size: 20px;
        }
        .card {
            width: 80vw;
            height: 80vh;
            background-image: url("images/christus.webp");
            background-position-x: -150px;
            background-position-y: -50px;
            padding: 2rem;
            border-radius: 20px;
            border: 3px solid #000000;
            text-align: center;
            color: #fffffe;
            padding: 1vw 5vw;
        }
        .image {
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }
        .image:hover {
            border: 4px solid black;
        }
        .first_pres_images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2vw;
        }
        .first_pres {
            width: 8vw;
            height: 8vw;
        }
        .prophet {
            width: 10vw;
            height: 10vw;
        }
        .quorum_images {
            display: grid;
            grid-template-columns: repeat(4, 8vw); /* 4 wide */
            gap: 2vw;
            max-width: 800px;
            margin: 0 auto;
            justify-content: center;
            align-items: center;
        }
        .quorum {
            width: 6vw;
            height: 6vw;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>First Presidency</h1>
        <div class="first_pres_images">
            <img src="images/eyring.webp" class="first_pres image">
            <img src="images/oaks.webp" class="first_pres prophet image">
            <img src="images/christofferson.webp" class="first_pres image">
        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div class="quorum_images">
            <img src="images/holland.webp" class="quorum image">
            <img src="images/uchtdorf.webp" class="quorum image">
            <img src="images/bednar.webp" class="quorum image">
            <img src="images/cook.webp" class="quorum image">
            <img src="images/anderson.webp" class="quorum image">
            <img src="images/rasband.webp" class="quorum image">
            <img src="images/stevenson.webp" class="quorum imae">
            <img src="images/renlund.webp" class="quorum image">
            <img src="images/gong.webp" class="quorum image">
            <img src="images/soares.webp" class="quorum image">
            <img src="images/kearon.webp" class="quorum image">
            <img src="images/causse.webp" class="quorum image">
        </div>
     </div>
</body>
</html>
