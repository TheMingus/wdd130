name: Update Movie

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch RSS
        run: |
          curl -s https://letterboxd.com/themrmingus/rss/ > rss.xml

      - name: Extract First Movie
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      
          TITLE=$(xmllint --xpath "string(//item[1]/title)" rss.xml)
          LINK=$(xmllint --xpath "string(//item[1]/link)" rss.xml)
      
          echo "{\"title\": \"$TITLE\", \"link\": \"$LINK\"}" > movie.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add movie.json
          git commit -m "Update movie" || echo "No changes"
          git push
