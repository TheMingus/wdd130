name: Update Movie

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch RSS
        run: |
          curl -s https://letterboxd.com/themrmingus/rss/ > rss.xml

      - name: Extract First Movie
        run: |
          TITLE=$(grep -oPm1 "(?<=<title>)[^<]+" rss.xml | sed -n 2p)
          LINK=$(grep -oPm1 "(?<=<link>)[^<]+" rss.xml | sed -n 2p)
          echo "{\"title\": \"$TITLE\", \"link\": \"$LINK\"}" > movie.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add movie.json
          git commit -m "Update movie" || echo "No changes"
          git push
